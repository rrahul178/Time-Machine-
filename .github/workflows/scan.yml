name: scan

on:
  schedule:
    - cron: '5 * * * *' # প্রতি ঘণ্টায়
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run scanner
        run: node scripts/scan.js
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      - name: Commit results
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add public/data/scan.json
          git diff --cached --quiet || (git commit -m "scan update" && git push)
